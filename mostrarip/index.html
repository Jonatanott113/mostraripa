<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meu IP</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f0f0f;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
    }

    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 48px 64px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .label {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #888;
      margin-bottom: 16px;
    }

    .ip {
      font-size: 48px;
      font-weight: 700;
      color: #4ade80;
      letter-spacing: 1px;
    }

    .sub {
      margin-top: 16px;
      font-size: 13px;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="card">
    <p class="label">Seu endereço IP</p>
    <p class="ip">{{IP}}</p>
    <p class="sub">Detectado pelo servidor</p>
  </div>
</body>
</html>
